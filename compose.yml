name: helicraft
include:
  - path: infra/compose.services.yml
services:
  migrate:
    build:
      context: .
      dockerfile: apps/antares/Dockerfile
    command: [bun, scripts/migrate.ts]
    environment:
      DATABASE_URL: postgresql://helicraft:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/helicraft
    depends_on:
      postgres: { condition: service_healthy }
  antares:
    build:
      context: .
      dockerfile: apps/antares/Dockerfile
    restart: unless-stopped
    volumes: ['./ops.json:/workspace/ops.json:ro']
    environment:
      PORT: '3000'
      DATABASE_URL: postgresql://helicraft:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/helicraft
      S3_ENDPOINT: http://storage:8333
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET:-helicraft}
      SITE_ORIGIN: ${SITE_ORIGIN:-http://localhost:8080}
      SECURE_COOKIES: ${SECURE_COOKIES:-false}
      REGISTRATION_ENABLED: ${REGISTRATION_ENABLED:-true}
      COMMUNITY_LINKS: '${COMMUNITY_LINKS:-[]}'
      SITE_PHASE: ${SITE_PHASE:-PRELAUNCH}
      MINECRAFT_ADDRESS: ${MINECRAFT_ADDRESS:-}
    depends_on:
      migrate: { condition: service_completed_successfully }
      storage: { condition: service_healthy }
    healthcheck:
      test:
        [
          CMD,
          bun,
          -e,
          "fetch('http://localhost:3000/api/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 15s
      retries: 12
  vega:
    build:
      context: .
      dockerfile: apps/vega/Dockerfile
    restart: unless-stopped
    environment:
      PORT: '8080'
      API_PROXY_TARGET: http://antares:3000
      SITE_ORIGIN: ${SITE_ORIGIN:-http://localhost:8080}
    ports:
      - '${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8080}:8080'
    depends_on:
      antares: { condition: service_healthy }
    healthcheck:
      test:
        [
          CMD,
          bun,
          -e,
          "fetch('http://localhost:8080/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
  deneb:
    profiles: [plugins]
    build:
      context: .
      dockerfile: apps/deneb/Dockerfile
      target: build
    command: ['true']
  rigel:
    profiles: [plugins]
    build:
      context: .
      dockerfile: apps/rigel/Dockerfile
      target: build
    command: ['true']
