name: helicraft-stand
include:
  - path: infra/compose.services.yml
services:
  migrate:
    extends: { file: compose.yml, service: migrate }
  antares:
    extends: { file: compose.yml, service: antares }
    environment:
      SITE_ORIGIN: ${SITE_ORIGIN:?Set the public HTTPS origin}
      SECURE_COOKIES: ${SECURE_COOKIES:-true}
  vega:
    build:
      context: .
      dockerfile: apps/vega/Dockerfile
    container_name: helicraft-stand-vega
    restart: unless-stopped
    environment:
      PORT: '8080'
      API_PROXY_TARGET: http://antares:3000
      SITE_ORIGIN: ${SITE_ORIGIN:?Set the public HTTPS origin}
    networks: [default, intranet]
    depends_on:
      antares: { condition: service_healthy }
    healthcheck:
      test:
        [
          CMD,
          bun,
          -e,
          "fetch('http://localhost:8080/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
networks:
  intranet:
    external: true
    name: intranet
