name: helicraft-minecraft-v1-test
services:
  postgres:
    image: postgis/postgis:18-3.6
    environment:
      POSTGRES_DB: helicraft_minecraft_test
      POSTGRES_USER: minecraft_test
      POSTGRES_PASSWORD: ${MC_TEST_DATABASE_PASSWORD:?Run bun run minecraft:prepare}
    volumes: [minecraft-postgres:/var/lib/postgresql]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U minecraft_test -d helicraft_minecraft_test]
      interval: 3s
      timeout: 3s
      retries: 30
  storage:
    image: chrislusf/seaweedfs:4.48
    command: [mini, '-dir=/data', '-s3.port=8333']
    environment:
      AWS_ACCESS_KEY_ID: minecraft_test
      AWS_SECRET_ACCESS_KEY: ${MC_TEST_STORAGE_SECRET:?Run bun run minecraft:prepare}
      S3_BUCKET: minecraft-test
    volumes: [minecraft-storage:/data]
    healthcheck:
      test: [CMD-SHELL, 'wget -q -O /dev/null http://localhost:9333/cluster/status']
      interval: 3s
      timeout: 3s
      retries: 30
  migrate:
    build: { context: ., dockerfile: apps/antares/Dockerfile }
    command: [bun, scripts/migrate.ts]
    environment:
      DATABASE_URL: postgresql://minecraft_test:${MC_TEST_DATABASE_PASSWORD}@postgres:5432/helicraft_minecraft_test
    depends_on:
      postgres: { condition: service_healthy }
  antares:
    build: { context: ., dockerfile: apps/antares/Dockerfile }
    environment:
      PORT: '3000'
      DATABASE_URL: postgresql://minecraft_test:${MC_TEST_DATABASE_PASSWORD}@postgres:5432/helicraft_minecraft_test
      MINECRAFT_DISPOSABLE: 'true'
      MINECRAFT_SERVICE_ACTORS: '[{"id":"rigel-test","role":"RIGEL","backendId":"deneb","token":"${MC_TEST_RIGEL_TOKEN}"},{"id":"deneb-test","role":"DENEB","backendId":"deneb","token":"${MC_TEST_DENEB_TOKEN}"}]'
      S3_ENDPOINT: http://storage:8333
      S3_ACCESS_KEY: minecraft_test
      S3_SECRET_KEY: ${MC_TEST_STORAGE_SECRET}
      S3_BUCKET: minecraft-test
      SITE_ORIGIN: http://localhost:8096
      SECURE_COOKIES: 'false'
      SITE_PHASE: OPEN
      MINECRAFT_ADDRESS: localhost:25575
    depends_on:
      migrate: { condition: service_completed_successfully }
      storage: { condition: service_healthy }
    healthcheck:
      test:
        [
          CMD,
          bun,
          '-e',
          "fetch('http://localhost:3000/api/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
  vega:
    build: { context: ., dockerfile: apps/vega/Dockerfile }
    environment:
      PORT: '8080'
      API_PROXY_TARGET: http://antares:3000
      SITE_ORIGIN: http://localhost:8096
    ports: ['127.0.0.1:8096:8080']
    depends_on:
      antares: { condition: service_healthy }
    healthcheck:
      test:
        [
          CMD,
          bun,
          '-e',
          "fetch('http://localhost:8080/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
  deneb:
    build: { context: ., dockerfile: apps/deneb/Dockerfile }
    environment:
      EULA: 'true'
      ANTARES_URL: http://antares:3000
      DENEB_SERVICE_TOKEN: ${MC_TEST_DENEB_TOKEN}
      FORWARDING_SECRET: ${MC_TEST_FORWARDING_SECRET}
      MINECRAFT_HTTP_TIMEOUT_MS: ${MINECRAFT_HTTP_TIMEOUT_MS:-4000}
      JAVA_XMS: 512M
      JAVA_XMX: 1G
    volumes: [minecraft-paper:/data]
    networks: [default, game]
    depends_on:
      antares: { condition: service_healthy }
    healthcheck:
      test:
        [CMD-SHELL, 'grep -q "Done (" logs/latest.log && grep -q "Deneb ready:" logs/latest.log']
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 30s
  rigel:
    build: { context: ., dockerfile: apps/rigel/Dockerfile }
    environment:
      ANTARES_URL: http://antares:3000
      RIGEL_SERVICE_TOKEN: ${MC_TEST_RIGEL_TOKEN}
      SITE_ORIGIN: http://localhost:8096
      FORWARDING_SECRET: ${MC_TEST_FORWARDING_SECRET}
      MINECRAFT_HTTP_TIMEOUT_MS: ${MINECRAFT_HTTP_TIMEOUT_MS:-4000}
      JAVA_XMS: 128M
      JAVA_XMX: 768M
    volumes: [minecraft-velocity:/data]
    ports: ['127.0.0.1:25575:25565']
    networks: [default, game]
    depends_on:
      deneb: { condition: service_healthy }
    healthcheck:
      test:
        [CMD-SHELL, 'grep -q "Done (" logs/latest.log && grep -q "Rigel ready:" logs/latest.log']
      interval: 5s
      timeout: 3s
      retries: 30
networks:
  game: { internal: true }
volumes:
  minecraft-postgres:
  minecraft-storage:
  minecraft-paper:
  minecraft-velocity:
