name: helicraft-coming-soon

services:
  web:
    image: helicraft/coming-soon:local
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${SOON_PORT:-3080}:3000"
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
