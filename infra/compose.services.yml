services:
  postgres:
    image: postgis/postgis:18-3.6
    restart: unless-stopped
    environment:
      POSTGRES_DB: helicraft
      POSTGRES_USER: helicraft
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U helicraft -d helicraft']
      interval: 5s
      timeout: 5s
      retries: 20
  storage:
    image: chrislusf/seaweedfs:4.48
    command: [mini, '-dir=/data', '-s3.port=8333']
    restart: unless-stopped
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY in .env}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY in .env}
      S3_BUCKET: ${S3_BUCKET:-helicraft}
    volumes:
      - storage-data:/data
    healthcheck:
      test: [CMD-SHELL, 'wget -q -O /dev/null http://localhost:9333/cluster/status']
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  postgres-data:
  storage-data:
